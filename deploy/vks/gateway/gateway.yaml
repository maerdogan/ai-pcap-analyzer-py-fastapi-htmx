# Gateway API route to the application. Needs Envoy Gateway; see docs/install.md.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: pcap-analyzer
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      envoyService:
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 192.168.104.161
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-pcap-analyzer
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: pcap-analyzer
    namespace: pcap-analyzer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pcap-analyzer
spec:
  gatewayClassName: envoy-pcap-analyzer
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: pcap-analyzer-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pcap-analyzer
spec:
  parentRefs:
    - name: pcap-analyzer
      sectionName: https
  rules:
    - backendRefs:
        - name: pcap-analyzer
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pcap-analyzer-redirect
spec:
  parentRefs:
    - name: pcap-analyzer
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
