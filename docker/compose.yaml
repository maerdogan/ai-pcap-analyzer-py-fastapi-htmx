# Copy .env.example to .env in this folder and set a password. Port 8000 must sit behind an HTTPS proxy.
services:
  pcap-analyzer:
    image: pcap-analyzer:0.1.0
    build:
      context: ..
      dockerfile: docker/Containerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - pcap-data:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pcap-data:
