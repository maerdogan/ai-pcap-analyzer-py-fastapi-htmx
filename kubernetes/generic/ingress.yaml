apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pcap-analyzer
  namespace: pcap-analyzer
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  tls:
    - hosts: [pcap.example.internal]
      secretName: pcap-analyzer-tls
  rules:
    - host: pcap.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pcap-analyzer
                port:
                  number: 8000
