{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentName }}
      {{- with .Values.gateway.parentNamespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames: [{{ .Values.gateway.host }}]
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: 8000
{{- end }}
