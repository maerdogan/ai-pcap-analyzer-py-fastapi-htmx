[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-analyzer"
description = "Find out why HTTP requests are slow, from a packet capture."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mehmet A. Erdogan" }]
dependencies = ["duckdb>=1.3"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcap-analyzer = "pcap_analyzer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pcap_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
