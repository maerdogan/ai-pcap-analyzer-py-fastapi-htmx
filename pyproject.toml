[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pcap-analyzer-py-fastapi-htmx"
description = "Find out why HTTP requests are slow, from a packet capture."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mehmet A. Erdogan" }]
dependencies = [
    "duckdb>=1.3",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pcap-analyzer = "pcap_analyzer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pcap_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pcap_analyzer" = ["knowledge.bin"]
"pcap_analyzer.web" = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
