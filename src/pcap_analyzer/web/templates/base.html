{% import "_macros.html" as ui %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{% block title %}pcap-analyzer{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/ag-grid.min.css">
  <link rel="stylesheet" href="/static/vendor/ag-theme-quartz.min.css">
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/ag-grid.min.js" defer></script>
  <script src="/static/vendor/echarts.min.js" defer></script>
  <script src="/static/app.js?v={{ version }}" defer></script>
</head>
<body class="shell">
  <aside class="side">
    <a class="brand" href="/">{{ ui.mark() }}<span>pcap-analyzer</span></a>
    <nav class="side-nav" aria-label="Main">
      <a href="/" {% if section == "captures" %}aria-current="page"{% endif %}>Captures</a>
      <a href="/compare" {% if section == "compare" %}aria-current="page"{% endif %}>Compare</a>
    </nav>
    {% block capture_nav %}{% endblock %}
    <div class="side-foot">
      <form method="post" action="/logout"><button class="side-link">Sign out</button></form>
      <span>Version {{ version }}</span>
    </div>
  </aside>
  <main class="page">{% block main %}{% endblock %}</main>
</body>
</html>
