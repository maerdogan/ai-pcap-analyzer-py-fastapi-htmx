<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{% block title %}pcap-analyzer{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/ag-grid.min.css">
  <link rel="stylesheet" href="/static/vendor/ag-theme-quartz.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/ag-grid.min.js" defer></script>
  <script src="/static/vendor/echarts.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">pcap-analyzer</a>
    {% block crumb %}{% endblock %}
    <a class="nav" href="/compare">Compare</a>
    <form method="post" action="/logout" class="logout"><button class="link">Sign out</button></form>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>pcap-analyzer {{ version }}</footer>
</body>
</html>
