{% import "_macros.html" as ui %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to pcap-analyzer</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body class="login-page">
  <main class="login">
    <div class="login-mark">{{ ui.mark() }}<span>pcap-analyzer</span></div>
    <h1>Sign in</h1>
    <p class="muted">See where the time went in your HTTP traffic.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>User name <input name="username" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary wide">Sign in</button>
    </form>
  </main>
</body>
</html>
